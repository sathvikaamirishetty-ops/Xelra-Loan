<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Xelra</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --input-border: #d1d5db;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
        }

        .results-container {
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .half {
            width: 50%;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .cta-button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .cta-button:hover {
            background-color: #1d4ed8;
        }

        /* Results Formatting */
        .cards-wrapper {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .bank-card {
            flex: 1;
            min-width: 280px;
            background: #fff;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: var(--shadow-md);
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .bank-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .bank-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .bank-card h2 {
            font-size: 1.25rem;
        }

        .loan-amount {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .loan-amount .label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .loan-amount .value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .details {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            min-height: 2.5em;
        }

        .bank-cta {
            background: transparent;
            border: 1px solid var(--input-border);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .bank-cta:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .disclaimer-box {
            background-color: #fffbeb;
            border: 1px solid #fcd34d;
            color: #92400e;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .disclaimer-box h3 {
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        /* Interest Rate on Result Card */
        .interest-rate-display {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ir-label {
            font-size: 0.8rem;
            color: #166534;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .ir-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #15803d;
        }

        /* Additional Styles from Login */
        .verification-container {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
        }

        .verification-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .verification-container {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
        }

        .verification-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .error-message {
            color: #dc3545;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .mobile-display {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="container verification-container">
        <div class="verification-card">
            <h1>Verify OTP</h1>
            <p class="mobile-display">Sent to {{ mobile }}</p>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% if demo_otp %}
            <div style="background-color: #e0f2fe; color: #0369a1; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; border: 1px solid #7dd3fc;">
                DEMO MODE: Your OTP is {{ demo_otp }}
            </div>
            {% endif %}

            <form action="/verify-otp" method="POST" class="loan-form">
                <!-- IMPORTANT: Pass the mobile number back to the server -->
                <input type="hidden" name="mobile" value="{{ mobile }}">

                <div class="form-group">
                    <label for="otp">One Time Password</label>
                    <input type="text" id="otp" name="otp" required placeholder="Enter 4-digit OTP" pattern="[0-9]{4}"
                        title="Please enter the 4-digit OTP" maxlength="4"
                        style="text-align: center; letter-spacing: 4px; font-size: 1.2rem;">
                </div>
                <button type="submit" class="cta-button">Verify OTP</button>
            </form>

            <a href="/login" class="resend-link"
                style="display:block; margin-top:1rem; color:#666; font-size:0.9rem; text-decoration:none;">Change
                Mobile Number</a>

            <form action="/send-otp" method="POST" style="margin-top: 5px;">
                <input type="hidden" name="mobile" value="{{ mobile }}">
                <button type="submit"
                    style="background:none; border:none; color:#004c8f; text-decoration:underline; cursor:pointer; font-size:0.9rem;">
                    Resend OTP
                </button>
            </form>
        </div>
    </div>
</body>


</html>
